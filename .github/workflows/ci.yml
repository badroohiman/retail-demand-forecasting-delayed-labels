name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Project deps
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Dev / quality tools
          pip install ruff black nbqa pytest nbval

      # ---------- Lint & format (code) ----------
      - name: Lint (ruff)
        run: |
          ruff check src

      - name: Format check (black)
        run: |
          black --check src

      # ---------- Lint & format (notebooks) ----------
      - name: Notebook format check (nbqa + black)
        run: |
          nbqa black --check notebooks

      - name: Notebook lint (nbqa + ruff)
        run: |
          nbqa ruff notebooks

      # ---------- Tests ----------
      - name: Unit tests
        run: |
          pytest -q

      # ---------- Notebook reproducibility ----------
      # Note: your notebooks read local parquet files that are not committed.
      # This step will run only if the expected processed file exists.
      - name: Notebook reproducibility (nbval)
        run: |
          if [ -f data/processed/m5_daily_sample.parquet ]; then
            pytest -q --nbval notebooks/01_eda.ipynb
          else
            echo "Skipping nbval: data/processed/m5_daily_sample.parquet not found (expected in local runs only)."
          fi

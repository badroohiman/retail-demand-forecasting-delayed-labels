name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black mypy pytest nbval

      - name: Lint (ruff)
        run: ruff check src

      - name: Format check (black)
        run: black --check src

      - name: Type check (mypy)
        run: mypy src || true

      - name: Unit tests
        run: pytest -q

      - name: Notebook reproducibility (nbval)
        run: pytest -q --nbval notebooks/01_eda.ipynb
